name: Publish to CurseForge

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'GitHub release tag, e.g. v0.2.244 or v0.2.244-beta'
        required: true
        type: string
    secrets:
      CF_API_TOKEN:
        required: true
      CF_PROJECT_ID:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release tag to re-upload'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  RELEASE_TAG_PATTERN: '^v[0-9]+\.[0-9]+\.[0-9]+(-beta)?$'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 on tarpeen, koska varaustagi tarkistetaan paikallisista
      # refeistä ja pushataan takaisin.
      - name: Check out the repository, with all of its history and tags
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # VERSION="${VERSION%-beta}" poistaa beta-päätteen kerran, täällä.
      # auto-kommentti kertoo, että tagin -beta-pääte ratkaisee kanavan.
      - name: Work out the channel from the tag
        id: channel
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          VERSION="${VERSION%-beta}"
          case "${TAG}" in
            *-beta) channel="beta" ;;
            *)      channel="release" ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      # Varaustagi curseforge/<tag> luodaan vasta onnistuneen uploadin jälkeen.
      # Näin uudelleenajo ei lähetä samaa tiedostoa kahdesti.
      - name: Check whether this release already has a reservation tag
        id: reservation
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/curseforge/${RELEASE_TAG}" >/dev/null; then
            echo "already=yes" >> "$GITHUB_OUTPUT"
            echo "curseforge/${RELEASE_TAG} exists; nothing to upload"
          else
            echo "already=no" >> "$GITHUB_OUTPUT"
            echo "curseforge/${RELEASE_TAG} does not exist; will upload"
          fi

      - name: Download the release asset
        if: steps.reservation.outputs.already == 'no'
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${RELEASE_TAG}" \
            --pattern "*.zip" \
            --exclude-drafts \
            --dir dist
          shopt -s nullglob
          zips=(dist/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .zip on ${RELEASE_TAG}, found ${#zips[@]}"
            ls -la dist
            exit 1
          fi
          echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"

      # curseforge.py upload lukee CF_API_TOKEN-ympäristömuuttujan ja
      # tarkistaa, että zipin TOC:n X-Curse-Project-ID täsmää --project-
      # parametriin. --release-tag liittää uploadin GitHub-releasen
      # changelogiin. --release-type tulee kanavasta.
      - name: Upload to CurseForge
        if: steps.reservation.outputs.already == 'no'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/release/curseforge.py upload \
            --zip "${{ steps.asset.outputs.zip }}" \
            --project "${{ secrets.CF_PROJECT_ID }}" \
            --release-type "${{ steps.channel.outputs.channel }}" \
            --release-tag "${RELEASE_TAG}"

      - name: Reserve the tag so a second run does not upload twice
        if: steps.reservation.outputs.already == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "curseforge/${RELEASE_TAG}"
          git push origin "curseforge/${RELEASE_TAG}"