name: Publish to CurseForge

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'GitHub release tag, e.g. v0.2.244 or v0.2.244-beta'
        required: true
        type: string
    secrets:
      CF_API_TOKEN:
        required: true
      CF_PROJECT_ID:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release tag to re-upload'
        required: true
        type: string

# The reservation tag is a real git tag pushed back to origin, so the job
# needs write access. Everything else it does is read-only.
permissions:
  contents: write

env:
  # Accepted tag shape: v0.2.244 or v0.2.244-beta. The (-beta)? group is the
  # only place the beta rule is written down.
  RELEASE_TAG_PATTERN: '^v[0-9]+\.[0-9]+\.[0-9]+(-beta)?$'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 is needed for the reservation tag check and push.
      - name: Check out with full history and tags
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # VERSION="${VERSION%-beta}" strips the beta suffix once, here, so the
      # version shown to players matches the stable form. auto: the tag's
      # -beta suffix is the only source of truth for the channel, on both
      # portals. On GitHub the release is created with --prerelease, on
      # CurseForge it is uploaded as release_type beta.
      - name: Work out version and channel from the tag
        id: channel
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          VERSION="${VERSION%-beta}"
          case "${TAG}" in
            *-beta) channel="beta" ;;
            *)      channel="release" ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      # curseforge/${RELEASE_TAG} is the reservation tag. It is created only
      # after a successful upload, so a re-run of this workflow skips an
      # asset that has already reached CurseForge.
      - name: Check whether this release already has a reservation tag
        id: reservation
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/curseforge/${RELEASE_TAG}" >/dev/null; then
            echo "already=yes" >> "$GITHUB_OUTPUT"
            echo "curseforge/${RELEASE_TAG} exists; nothing to upload"
          else
            echo "already=no" >> "$GITHUB_OUTPUT"
            echo "curseforge/${RELEASE_TAG} does not exist; will upload"
          fi

      - name: Download the release asset
        if: steps.reservation.outputs.already == 'no'
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # --exclude-drafts is load-bearing: a draft release is invisible to
          # the public releases API, so downloading from one would either
          # fail or hand back a stale asset that no player can reach.
          gh release download "${RELEASE_TAG}" \
            --pattern "*.zip" \
            --exclude-drafts \
            --dir dist
          shopt -s nullglob
          zips=(dist/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .zip on ${RELEASE_TAG}, found ${#zips[@]}"
            ls -la dist
            exit 1
          fi
          echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload to CurseForge
        if: steps.reservation.outputs.already == 'no'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 .github/release/curseforge.py upload \
            --zip "${{ steps.asset.outputs.zip }}" \
            --project "${{ secrets.CF_PROJECT_ID }}" \
            --release-type "${{ steps.channel.outputs.channel }}" \
            --release-tag "${RELEASE_TAG}"

      - name: Reserve the tag so a second run does not upload twice
        if: steps.reservation.outputs.already == 'no'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "curseforge/${RELEASE_TAG}"
          git push origin "curseforge/${RELEASE_TAG}"