name: Publish to CurseForge

# Accepted release-tag shape: ^v[0-9]+\.[0-9]+\.[0-9]+(-beta)?$. A trailing
# -beta is uploaded as a CurseForge beta; anything else as a full release.
on:
  workflow_call:
    inputs:
      release_tag:
        description: 'GitHub release tag, e.g. v0.2.244 or v0.2.244-beta'
        required: true
        type: string
    secrets:
      CF_API_TOKEN:
        description: 'CurseForge API token'
        required: true
      CF_PROJECT_ID:
        description: 'Numeric CurseForge project ID'
        required: true

# Read-only: this job downloads an asset and uploads it elsewhere; it never
# writes to the repository. The caller (release.yml) is the one with
# contents: write.
permissions:
  contents: read

env:
  # The regex that the input tag is expected to match, kept here so the
  # supported shapes are visible in one place.
  RELEASE_TAG_PATTERN: '^v[0-9]+\.[0-9]+\.[0-9]+(-beta)?$'

jobs:
  publish:
    name: Upload to CurseForge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the one release asset
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ inputs.release_tag }}" --pattern "*.zip" --dir dist

          shopt -s nullglob
          zips=(dist/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .zip on ${{ inputs.release_tag }}, found ${#zips[@]}"
            ls -la dist
            exit 1
          fi
          file="${zips[0]}"
          echo "file_path=${file}" >> "$GITHUB_OUTPUT"
          echo "file_name=$(basename "$file")" >> "$GITHUB_OUTPUT"

      # The changelog is taken from the same GitHub release as the asset, so
      # both portals stay in sync. If you ever switch from the action to the
      # repository's own helper, the equivalent call is:
      #   python3 .github/release/curseforge.py notes --release-tag "${RELEASE_TAG}"
      # and the upload would use --release-tag "${RELEASE_TAG}" as well.
      - name: Upload to CurseForge
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CF_API_TOKEN }}
          project_id: ${{ secrets.CF_PROJECT_ID }}
          game_endpoint: 'wow'
          file_path: ${{ steps.asset.outputs.file_path }}
          release_type: ${{ contains(inputs.release_tag, '-beta') && 'beta' || 'release' }}
          display_name: ${{ steps.asset.outputs.file_name }}
          changelog: |
            Full changelog: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.release_tag }}
          changelog_type: 'markdown'