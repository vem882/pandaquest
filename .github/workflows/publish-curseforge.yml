name: Publish to CurseForge

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'GitHub release tag, e.g. v0.2.244 or v0.2.244-beta'
        required: true
        type: string
      component:
        description: 'Addon to upload from the release'
        required: false
        default: core
        type: string
    secrets:
      CF_API_TOKEN:
        required: true
      CF_PROJECT_ID:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release tag to re-upload'
        required: true
        type: string
      component:
        description: 'Addon to upload from the release'
        required: true
        default: core
        type: choice
        options:
          - core
          - database
          - auction

permissions:
  contents: write

env:
  RELEASE_TAG_PATTERN: '^v[0-9]+\.[0-9]+\.[0-9]+(-beta)?$'

jobs:
  publish:
    name: Upload
    runs-on: [self-hosted, pandaquest-addon]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      DOWNLOAD_DIR: upload
    steps:
      - name: Check out with full history and tags
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Work out version and channel from the tag
        id: channel
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ${RELEASE_TAG_PATTERN} ]]; then
            echo "::error::${TAG} is not a release tag of the form v0.2.244 or v0.2.244-beta"
            exit 1
          fi
          VERSION="${TAG#v}"
          VERSION="${VERSION%-beta}"
          case "${TAG}" in
            *-beta) channel="beta" ;;
            *)      channel="release" ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Resolve the component release
        id: package
        env:
          COMPONENT: ${{ inputs.component }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CF_PROJECT_ID: ${{ secrets.CF_PROJECT_ID }}
          DATABASE_SLUG: ${{ vars.CF_DATABASE_SLUG }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          version="${version%-beta}"
          source_repo="${GH_REPO}"
          case "${COMPONENT}" in
            core)
              addon="PandaQuest"
              project="${CF_PROJECT_ID:-1735809}"
              dependency="${DATABASE_SLUG:-}"
              reservation="curseforge/${RELEASE_TAG}"
              ;;
            database)
              source_repo="vem882/pqDB"
              package_pattern="PandaQuestDB-${version}.zip"
              addon="PandaQuestDB"
              project="1807827"
              dependency=""
              reservation="curseforge/database/${RELEASE_TAG}"
              ;;
            auction)
              source_repo="vem882/pqAuction"
              package_pattern="PandaQuestAuction-${version}.zip"
              addon="PandaQuestAuction"
              project="1807835"
              dependency="pandaquest"
              reservation="curseforge/auction/${RELEASE_TAG}"
              ;;
            *)
              echo "::error::Unknown component: ${COMPONENT}"
              exit 1
              ;;
          esac
          if [[ -n "${dependency}" && ! "${dependency}" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Invalid CurseForge dependency slug"
            exit 1
          fi
          # gh release download does not support --exclude-drafts on all runner gh versions,
          # so the published-release check is explicit. "auto" remains the tag-derived mode.
          is_draft=$(gh release view "${RELEASE_TAG}" --repo "${source_repo}" --json isDraft --jq '.isDraft')
          if [[ "${is_draft}" == "true" ]]; then
            echo "::error::Release ${RELEASE_TAG} is a draft"
            exit 1
          fi
          mkdir -p dist
          if [[ "${COMPONENT}" == core ]]; then
            assets="$(gh release view "${RELEASE_TAG}" --repo "${source_repo}" --json assets --jq '.assets[].name')"
            core_package="PandaQuest-Core-${version}.zip"
            if grep -Fx "${core_package}" <<< "${assets}" >/dev/null; then
              package_pattern="${core_package}"
            else
              package_pattern="$(grep -E "^PandaQuest-${version}(\\+[^/]+)?\\.zip$" <<< "${assets}" | head -n 1)"
              if [[ -z "${package_pattern}" ]]; then
                echo "::error::No PandaQuest package found in ${RELEASE_TAG}"
                exit 1
              fi
            fi
          fi
          gh release download "${RELEASE_TAG}" --repo "${source_repo}" \
            --pattern "${package_pattern}" --dir dist
          shopt -s nullglob
          zips=(dist/*.zip)
          if [[ "${#zips[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one package for ${COMPONENT}, found ${#zips[@]}"
            ls -la dist
            exit 1
          fi
          if [[ "${COMPONENT}" == core ]]; then
            normalized="dist/PandaQuest-${version}.zip"
            temporary="${normalized}.tmp"
            source="${zips[0]}"
            if [[ "${source}" == "dist/PandaQuest-Core-${version}.zip" ]]; then
              mv "${source}" "${normalized}"
            else
              python3 -c 'import sys,zipfile; source,target=sys.argv[1:3]; source_zip=zipfile.ZipFile(source); target_zip=zipfile.ZipFile(target,"w",zipfile.ZIP_DEFLATED); entries=[info for info in source_zip.infolist() if info.filename.startswith("PandaQuest/")]; [target_zip.writestr(info,source_zip.read(info.filename)) for info in entries]; target_zip.close(); source_zip.close()' \
                "${source}" "${temporary}"
              mv "${temporary}" "${normalized}"
              rm -f "${source}"
            fi
            zips=("${normalized}")
            git show "${RELEASE_TAG}:PandaQuest/changelog.txt" > dist/changelog.txt
            changelog="dist/changelog.txt"
          else
            printf '%s\n' "${version}" > dist/changelog.txt
            gh release view "${RELEASE_TAG}" --repo "${source_repo}" --json body --jq '.body' >> dist/changelog.txt
            changelog="dist/changelog.txt"
          fi
          {
            echo "source_repo=${source_repo}"
            echo "zip=${zips[0]}"
            echo "addon=${addon}"
            echo "project=${project}"
            echo "dependency=${dependency}"
            echo "reservation=${reservation}"
            echo "changelog=${changelog}"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether this release already has a reservation tag
        id: reservation
        env:
          RESERVATION: ${{ steps.package.outputs.reservation }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${RESERVATION}:refs/tags/${RESERVATION}" 2>/dev/null || true
          if git rev-parse --verify --quiet "refs/tags/${RESERVATION}" >/dev/null; then
            echo "already=yes" >> "$GITHUB_OUTPUT"
            echo "${RESERVATION} exists; nothing to upload"
          else
            echo "already=no" >> "$GITHUB_OUTPUT"
            echo "${RESERVATION} does not exist; will upload"
          fi

      - name: Upload to CurseForge
        if: steps.reservation.outputs.already == 'no'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 .github/release/curseforge.py upload \
            --zip "${{ steps.package.outputs.zip }}" \
            --addon "${{ steps.package.outputs.addon }}" \
            --project "${{ steps.package.outputs.project }}" \
            --dependency-slug "${{ steps.package.outputs.dependency }}" \
            --changelog-txt "${{ steps.package.outputs.changelog }}" \
            --release-type "${{ steps.channel.outputs.channel }}" \
            --release-tag "${RELEASE_TAG}"

      - name: Reserve the tag so a second run does not upload twice
        if: steps.reservation.outputs.already == 'no'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RESERVATION: ${{ steps.package.outputs.reservation }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${RESERVATION}"
          git push origin "${RESERVATION}"
