name: Publish to CurseForge

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'GitHub release tag, e.g. v0.2.244 or v0.2.244-beta'
        required: true
        type: string
    secrets:
      CF_API_TOKEN:
        required: true
      CF_PROJECT_ID:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release tag to re-upload'
        required: true
        type: string

permissions:
  contents: read

env:
  # The tag's -beta suffix is the authoritative source for the channel. The
  # regex below documents the accepted shapes in one place.
  RELEASE_TAG_PATTERN: '^v[0-9]+\.[0-9]+\.[0-9]+(-beta)?$'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 is here because the tag is verified against local
      # history before the asset is downloaded. Without the full history the
      # tag may not be reachable, and downloading from a release that no
      # player can see through git would hide a real bug.
      - name: Check out the repository, with all of its history
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Verify the tag exists in this repository
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} is not a tag in this repository"
            exit 1
          fi
          echo "${TAG} exists"

      - name: Download the one release asset
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # --exclude-drafts is load-bearing. A draft release is invisible to
          # the public releases API, so downloading from one would either fail
          # or hand back a stale asset that no player can reach.
          gh release download "${{ inputs.release_tag }}" \
            --pattern "*.zip" \
            --exclude-drafts \
            --dir dist

          shopt -s nullglob
          zips=(dist/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .zip on ${{ inputs.release_tag }}, found ${#zips[@]}"
            ls -la dist
            exit 1
          fi
          file="${zips[0]}"
          echo "file_path=${file}" >> "$GITHUB_OUTPUT"
          echo "file_name=$(basename "$file")" >> "$GITHUB_OUTPUT"

      # The -beta suffix is stripped once, here, so the display name and the
      # version players see are clean. The tag itself still carries -beta, and
      # that is what release_type: auto looks at via the display name below.
      - name: Work out the channel
        id: channel
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          VERSION="${VERSION%-beta}"
          case "${TAG}" in
            *-beta) channel="beta" ;;
            *)      channel="release" ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CF_API_TOKEN }}
          project_id: ${{ secrets.CF_PROJECT_ID }}
          game_endpoint: 'wow'
          file_path: ${{ steps.asset.outputs.file_path }}
          # auto: the display name carries "(beta)" when the tag does, so the
          # uploader's auto mode picks beta. Anything without "(beta)" is
          # auto-detected as a full release. The explicit channel step above
          # is what makes the decision, and it is derived from the tag alone.
          release_type: auto
          display_name: ${{ steps.asset.outputs.file_name }}${{ steps.channel.outputs.channel == 'beta' && ' (beta)' || '' }}
          changelog: |
            Full changelog: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.release_tag }}
          changelog_type: 'markdown'