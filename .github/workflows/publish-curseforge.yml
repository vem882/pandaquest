name: Publish to CurseForge

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'GitHub release tag, e.g. v0.2.244 or v0.2.244-beta'
        required: true
        type: string
    secrets:
      CF_API_TOKEN:
        required: true
      CF_PROJECT_ID:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release tag to re-upload'
        required: true
        type: string

# The reservation tag is a real git tag pushed back to origin, so the job
# needs write access. Everything else it does is read-only.
permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  RELEASE_TAG_PATTERN: '^v[0-9]+\.[0-9]+\.[0-9]+(-beta)?$'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 is load-bearing: the reservation tag is checked against
      # local refs, and pushing it back needs the full history so git knows
      # where the branch came from.
      - name: Check out the repository, with all of its history and tags
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # VERSION="${VERSION%-beta}" strips the beta suffix once, here, so the
      # version players see on CurseForge matches the stable form. auto below
      # means: the tag's -beta suffix decides the channel, without a second
      # place to keep the rule.
      - name: Work out the channel from the tag
        id: channel
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          VERSION="${VERSION%-beta}"
          case "${TAG}" in
            *-beta) channel="beta" ;;
            *)      channel="release" ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      # The reservation tag marks a release whose asset is already on
      # CurseForge. It is created after a successful upload, so a re-run of
      # this workflow skips a file that has already been sent.
      - name: Check whether this release already has a reservation tag
        id: reservation
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/curseforge/${RELEASE_TAG}" >/dev/null; then
            echo "already=yes" >> "$GITHUB_OUTPUT"
            echo "curseforge/${RELEASE_TAG} exists; nothing to upload"
          else
            echo "already=no" >> "$GITHUB_OUTPUT"
            echo "curseforge/${RELEASE_TAG} does not exist; will upload"
          fi

      - name: Download the release asset
        if: steps.reservation.outputs.already == 'no'
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # --exclude-drafts is load-bearing: a draft release is invisible to
          # the public releases API, so downloading from one would either
          # fail or hand back a stale asset no player can reach.
          gh release download "${RELEASE_TAG}" \
            --pattern "*.zip" \
            --exclude-drafts \
            --dir dist
          shopt -s nullglob
          zips=(dist/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .zip on ${RELEASE_TAG}, found ${#zips[@]}"
            ls -la dist
            exit 1
          fi
          echo "file=${zips[0]}" >> "$GITHUB_OUTPUT"

      # curseforge.py upload is the repository's own helper. It reads the
      # tag's -beta suffix, matches the asset's TOCs to CurseForge game
      # versions, and refuses to send a file it has not verified.
      # --release-tag ties the upload to the release whose notes are its
      # changelog. --file points at the one asset already downloaded above,
      # so what is uploaded is what was checked.
      - name: Upload to CurseForge
        if: steps.reservation.outputs.already == 'no'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/release/curseforge.py upload \
            --release-tag "${RELEASE_TAG}" \
            --file "${{ steps.asset.outputs.file }}"

      # The tag is pushed only after the upload succeeded. If the workflow
      # fails earlier, no tag is created and a re-run will try again.
      - name: Reserve the tag so a second run does not upload twice
        if: steps.reservation.outputs.already == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "curseforge/${RELEASE_TAG}"
          git push origin "curseforge/${RELEASE_TAG}"