name: Publish to CurseForge

# Accepted release-tag shape: ^v[0-9]+\.[0-9]+\.[0-9]+(-beta)?$. A trailing
# -beta is uploaded as a CurseForge beta; anything else as a full release.
on:
  workflow_call:
    inputs:
      release_tag:
        description: 'GitHub release tag, e.g. v0.2.244 or v0.2.244-beta'
        required: true
        type: string
    secrets:
      CF_API_TOKEN:
        description: 'CurseForge API token'
        required: true
      CF_PROJECT_ID:
        description: 'Numeric CurseForge project ID'
        required: true
  # Manual re-runs from the Actions tab. Use this when a release exists and its
  # asset is verified, but the CurseForge upload needs to be retried without
  # touching the release job.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release tag to re-upload'
        required: true
        type: string

# Read-only: this job downloads an asset and uploads it elsewhere; it never
# writes to the repository. The caller (release.yml) is the one with
# contents: write.
permissions:
  contents: read

env:
  # The regex that the input tag is expected to match, kept here so the
  # supported shapes are visible in one place. A -beta tag is a prerelease
  # on GitHub (`gh release create --prerelease`) and a beta on CurseForge.
  RELEASE_TAG_PATTERN: '^v[0-9]+\.[0-9]+\.[0-9]+(-beta)?$'

jobs:
  publish:
    name: Upload to CurseForge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the one release asset
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # --exclude-drafts is load-bearing. A draft release is invisible to
          # the public releases API, so downloading from one would either fail
          # or hand us a stale asset that no player can reach. Only a published
          # release carries the bytes players download.
          gh release download "${{ inputs.release_tag }}" \
            --pattern "*.zip" \
            --exclude-drafts \
            --dir dist

          shopt -s nullglob
          zips=(dist/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .zip on ${{ inputs.release_tag }}, found ${#zips[@]}"
            ls -la dist
            exit 1
          fi
          file="${zips[0]}"
          echo "file_path=${file}" >> "$GITHUB_OUTPUT"
          echo "file_name=$(basename "$file")" >> "$GITHUB_OUTPUT"

      # The beta suffix is decided once, here, and stripped from the version
      # that gets shown to players. The upload below reads `channel` rather
      # than re-parsing the tag a second time. This mirrors what release.yml
      # does with `--prerelease`: a -beta tag is a prerelease on GitHub and a
      # beta on CurseForge.
      - name: Work out the channel
        id: channel
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          VERSION="${VERSION%-beta}"
          case "${TAG}" in
            *-beta) channel="beta" ;;
            *)      channel="release" ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # The changelog is taken from the same GitHub release as the asset, so
      # both portals stay in sync. If you ever switch from the action to the
      # repository's own helper, the equivalent call is:
      #   python3 .github/release/curseforge.py notes --release-tag "${RELEASE_TAG}"
      # and the upload would use --release-tag "${RELEASE_TAG}" as well.
      - name: Upload to CurseForge
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CF_API_TOKEN }}
          project_id: ${{ secrets.CF_PROJECT_ID }}
          game_endpoint: 'wow'
          file_path: ${{ steps.asset.outputs.file_path }}
          release_type: ${{ steps.channel.outputs.channel }}
          display_name: ${{ steps.asset.outputs.file_name }}
          changelog: |
            Full changelog: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.release_tag }}
          changelog_type: 'markdown'