# Build PandaQuest-<version>+pqAuction-<auction-version>+pqDB-<db-version>.zip and publish it
# as the single asset of a GitHub release.
name: Release

on:
  push:
    branches: ["main"]
  pull_request:
  # For re-publishing a release whose upload failed after a green build. The version comes from
  # the commit count, so a dispatch on the same commit rebuilds the same version, and the
  # publish step below replaces that release's asset rather than failing on the existing tag.
  workflow_dispatch:

# Read by default. Only the release job widens this, and only to contents: write.
permissions:
  contents: read

concurrency:
  # A second push to a pull request makes the first run's answer irrelevant. A run on main is
  # never cancelled: it may be between creating a release and uploading its asset, which would
  # leave a tagged release with nothing attached -- and the portal reads the asset, not the tag.
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: check and build the package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.build.outputs.version }}
      package: ${{ steps.build.outputs.package }}
      sha256: ${{ steps.build.outputs.sha256 }}
      tag: ${{ steps.build.outputs.tag }}
      channel: ${{ steps.build.outputs.channel }}
    steps:
      # fetch-depth: 0 is load-bearing, and it fails silently without it. The shipped version is
      # this repository's commit count (build.py: release_version), and a shallow clone counts
      # what it was given rather than failing: measured here, a depth-1 clone of this repository
      # builds PandaQuest-0.2.1.zip -- well formed, matching the portal's pattern, and sorting below
      # every package the portal already has, so /setup would go on offering the old build while
      # this run stayed green.
      - name: Check out the repository, with all of its history
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Check the runner's python
        run: |
          set -euo pipefail
          python3 --version
          python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 9) else "python3 >= 3.9 required")'

      # Emits the pin and the release version for each external component. The versions are
      # what go into the combined package name; the pins are what the sub-checkouts use.
      - name: Read component pins and versions
        id: pins
        run: |
          set -euo pipefail
          for component in database auction; do
            pin="$(python3 .github/release/components.py --pin "$component")"
            ver="$(python3 .github/release/components.py --version "$component")"
            echo "$component=$pin" >> "$GITHUB_OUTPUT"
            echo "${component}_version=$ver" >> "$GITHUB_OUTPUT"
          done

      - name: Check out PandaQuest Database
        uses: actions/checkout@v4.2.2
        with:
          repository: vem882/pqDB
          ref: ${{ steps.pins.outputs.database }}
          path: .components/database
          persist-credentials: false

      - name: Check out PandaQuest Auction
        uses: actions/checkout@v4.2.2
        with:
          repository: vem882/pqAuction
          ref: ${{ steps.pins.outputs.auction }}
          path: .components/auction
          persist-credentials: false

      - name: Download the published component releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .components/releases
          database="$(python3 .github/release/components.py --version database)"
          auction="$(python3 .github/release/components.py --version auction)"
          gh release download "v$database" -R vem882/pqDB --pattern "PandaQuestDB-$database.zip" --dir .components/releases
          gh release download "v$auction" -R vem882/pqAuction --pattern "PandaQuestAuction-$auction.zip" --dir .components/releases

      - name: Run the checks
        env:
          PQ_DATABASE_DIR: ${{ github.workspace }}/.components/database/PandaQuestDB
          PQ_AUCTION_DIR: ${{ github.workspace }}/.components/auction/PandaQuestAuction
        run: python3 .github/release/check.py -v

      - name: Build the package
        id: build
        env:
          DATABASE_VERSION: ${{ steps.pins.outputs.database_version }}
          AUCTION_VERSION: ${{ steps.pins.outputs.auction_version }}
        run: |
          set -euo pipefail
          version="$(python3 .github/release/build.py version)"
          tag="$(python3 .github/release/build.py tag)"
          channel="$(python3 .github/release/build.py channel)"
          core="PandaQuest-Core-${version}.zip"

          # The one asset players download: every component's version in the name, so a
          # support ticket or a CurseForge listing can be matched to a build without opening
          # the zip. Order is PandaQuest, then the components, left to right.
          package="PandaQuest-${version}+pqAuction-${AUCTION_VERSION}+pqDB-${DATABASE_VERSION}.zip"

          for output in dist second; do
            python3 .github/release/build.py package --out "${output}/${core}"
            python3 .github/release/components.py --core "${output}/${core}" --out "${output}" \
              --database .components/database --auction .components/auction --releases .components/releases

            # components.py emits the combined archive as PandaQuest-<version>.zip; give it the
            # version-carrying name before determinism is checked, so cmp compares like with
            # like and the sha256 recorded below is a fact about the file that ships.
            mv "${output}/PandaQuest-${version}.zip" "${output}/${package}"

            # The standalone core and component zips are intermediates. Keeping them out of
            # dist means the release carries exactly one asset, the same way Questie's does.
            rm -f "${output}"/PandaQuest-Core-*.zip \
                  "${output}"/PandaQuestDB-*.zip \
                  "${output}"/PandaQuestAuction-*.zip
          done

          # Built a second time, into a different directory, and compared. Determinism is part of
          # the contract, and the cheapest honest test of it is to do it twice in one job: it
          # catches a clock, a umask or a directory order leaking into the archive. It does NOT
          # claim the same bytes on a different machine or a different zlib -- README.md says so.
          first="$(sha256sum "dist/${package}" | cut -d' ' -f1)"
          for artifact in dist/*.zip; do
            cmp "$artifact" "second/${artifact##*/}"
          done
          sha256sum dist/*.zip > dist/SHA256SUMS
          rm -rf second

          {
            echo "version=${version}"
            echo "package=${package}"
            echo "sha256=${first}"
            echo "tag=${tag}"
            echo "channel=${channel}"
          } >> "$GITHUB_OUTPUT"

      - name: Write the release notes' changelog
        run: |
          set -euo pipefail
          mkdir -p release-notes
          python3 .github/release/curseforge.py notes --version "${{ steps.build.outputs.version }}" \
            --tag "${{ steps.build.outputs.tag }}" > release-notes/changes.md
          echo "release notes' changelog: $(wc -c < release-notes/changes.md) bytes"

      - name: Say what was built
        run: |
          set -euo pipefail
          {
            echo "## ${{ steps.build.outputs.package }}"
            echo
            echo "| fact | value |"
            echo "|------|-------|"
            echo "| version | \`${{ steps.build.outputs.version }}\` |"
            echo "| sha256 | \`${{ steps.build.outputs.sha256 }}\` |"
            echo "| bytes | $(stat -c%s "dist/${{ steps.build.outputs.package }}") |"
            echo "| entries | $(python3 -c "import zipfile,sys;print(len(zipfile.ZipFile(sys.argv[1]).infolist()))" "dist/${{ steps.build.outputs.package }}") |"
            echo "| build identity | \`$(python3 .github/release/build.py identity --json | python3 -c 'import json,sys;print(json.load(sys.stdin)["build"])')\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the package
        uses: actions/upload-artifact@v4.4.3
        with:
          name: PandaQuest-${{ steps.build.outputs.version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Keep the release notes' changelog
        uses: actions/upload-artifact@v4.4.3
        with:
          name: release-notes-${{ steps.build.outputs.version }}
          path: release-notes/changes.md
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish the release asset
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - name: Take the package the build job checked
        uses: actions/download-artifact@v4.1.8
        with:
          name: PandaQuest-${{ needs.build.outputs.version }}
          path: dist

      - name: Take the release notes' changelog
        uses: actions/download-artifact@v4.1.8
        with:
          name: release-notes-${{ needs.build.outputs.version }}
          path: release-notes

      # The artifact is re-zipped by upload-artifact and unpacked again by download-artifact.
      # This asserts that round trip gave back the same bytes, so the sha256 in the release notes
      # is a fact about the file players download and not about a file that no longer exists.
      - name: Check the bytes are the ones that were built
        run: |
          set -euo pipefail
          sha256sum --check --strict dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PACKAGE: ${{ needs.build.outputs.package }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          TAG: ${{ needs.build.outputs.tag }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          bytes="$(stat -c%s "dist/${PACKAGE}")"
          if [ "${CHANNEL}" = "beta" ]; then
            label="${VERSION} (beta)"
            kind="Pre-release: new features here have not yet been confirmed in the game."
            prerelease="true"
          else
            label="${VERSION}"
            kind="Stable release."
            prerelease="false"
          fi
          printf '%s\n' \
            "PandaQuest ${label} for MoP Classic, Classic Era, TBC Anniversary and WoW Forever." \
            "${kind}" \
            "" \
            "| | |" \
            "|---|---|" \
            "| commit | \`${GITHUB_SHA}\` |" \
            "| asset | \`${PACKAGE}\` |" \
            "| sha256 | \`${SHA256}\` |" \
            "" \
            "Unzip \`${PACKAGE}\` into the Interface/AddOns folder for your game version." \
            "Licence: GPLv3. Content is completed at the PandaQuest portal, pd.zroot.it." > notes.md
          if [ -s release-notes/changes.md ]; then
            { echo; cat release-notes/changes.md; } >> notes.md
          fi

          gh release list --limit 200 --json tagName,isDraft,isPrerelease > releases.json

          python3 - "${tag}" "${VERSION}" releases.json exists.txt <<'GUARD'
          import json
          import re
          import sys

          tag, version, listing, answer = sys.argv[1:5]
          releases = json.loads(open(listing, encoding="utf-8").read())

          # The ordering the version is defined by: tuple(int(part) for part in version.split(".")).
          # A "-beta" suffix on a tag is ignored, so v0.2.140-beta counts as 0.2.140.
          def key(value):
              return tuple(int(part) for part in value.split("."))

          published = [
              match.group(1)
              for release in releases
              for match in [re.fullmatch(r"v(\d+(?:\.\d+)*)(?:-beta)?", release["tagName"])]
              if match and match.group(1) != version
          ]
          if published:
              highest = max(published, key=key)
              if key(version) <= key(highest):
                  raise SystemExit(
                      f"::error::{version} does not sort above {highest}, which this repository "
                      "has already published. Anything that picks the highest version would keep "
                      "offering that one, and nothing would report it."
                  )
              print(f"{version} sorts above {highest}, the highest already published")
          else:
              print(f"{version} is the first release here with a version-shaped tag")

          found = any(release["tagName"] == tag for release in releases)
          open(answer, "w", encoding="utf-8").write("yes" if found else "no")
          GUARD

          if [ "$(cat exists.txt)" = "yes" ]; then
            gh release view "${tag}" --json isDraft,assets > release.json
            same="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1], encoding="utf-8")); print(any(a["name"] == sys.argv[2] and a["size"] == int(sys.argv[3]) for a in r["assets"]))' \
              release.json "${PACKAGE}" "${bytes}")"
            if [ "${same}" = "True" ]; then
              echo "${tag} already carries ${PACKAGE} at ${bytes} bytes; leaving it alone"
            else
              # --clobber deletes the existing asset BEFORE uploading, and gh's own help says
              # that a failed upload then loses the original. That is the one branch that turns
              # a working release into an empty one, so it is reached only when there is nothing
              # working to lose: the case above skips the upload when the asset is already these
              # exact bytes, which is what a re-run of an unchanged main actually hits.
              echo "${tag} exists without these bytes; uploading ${PACKAGE}"
              gh release upload "${tag}" "dist/${PACKAGE}" --clobber
            fi
            # `gh release create` with an asset is three API calls: create as a draft, upload,
            # publish. A run that died after the first leaves a draft holding the tag, and a
            # draft is not served by the public releases API -- nobody sees it at all while the
            # run is green. Finish that publish rather than parking the asset on it.
            draft="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["isDraft"])' release.json)"
            if [ "${draft}" = "True" ]; then
              echo "::warning::${tag} was left as a draft; publishing it now"
              if [ "${prerelease}" = "true" ]; then
                gh release edit "${tag}" --draft=false --prerelease
              else
                gh release edit "${tag}" --draft=false --prerelease=false --latest
              fi
            elif [ "${prerelease}" = "true" ]; then
              gh release edit "${tag}" --prerelease
            else
              gh release edit "${tag}" --prerelease=false
            fi
          else
            # --target pins the tag to the commit this zip was built from. Without it gh creates
            # the tag from the latest state of the default branch at publish time, which on a
            # busy main is a different commit from the one the notes and the archive comment
            # both name -- and `git checkout v<version>` then gives the wrong tree.
            # --prerelease and --latest are never sent together: a prerelease cannot be "Latest",
            # and whether the API rejects or ignores the pair was not tested.
            if [ "${prerelease}" = "true" ]; then
              flags=(--prerelease --latest=false)
            else
              flags=(--latest)
            fi
            gh release create "${tag}" dist/*.zip \
              --target "${GITHUB_SHA}" \
              --title "PandaQuest ${label}" \
              --notes-file notes.md \
              "${flags[@]}"
          fi

      - name: Check the release a player would download
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PACKAGE: ${{ needs.build.outputs.package }}
          TAG: ${{ needs.build.outputs.tag }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          bytes="$(stat -c%s "dist/${PACKAGE}")"
          gh release view "${tag}" --json tagName,isDraft,isPrerelease,assets > published.json

          python3 - "${tag}" "${PACKAGE}" "${bytes}" published.json "${CHANNEL}" <<'CONFIRM'
          import json
          import sys

          tag, package, size, path, channel = sys.argv[1:6]
          release = json.loads(open(path, encoding="utf-8").read())
          assets = {asset["name"]: asset["size"] for asset in release["assets"]}

          if release["isDraft"]:
              raise SystemExit(
                  f"::error::{tag} is still a draft. The public releases API does not serve a "
                  "draft, so the portal would download nothing."
              )
          if release["isPrerelease"] != (channel == "beta"):
              raise SystemExit(
                  f"::error::{tag} is {'a prerelease' if release['isPrerelease'] else 'not a prerelease'} "
                  f"but the build's channel is {channel}. A beta must not go out as the stable release, "
                  "or the other way round."
              )
          from pathlib import Path

          for local in Path("dist").glob("*.zip"):
              if assets.get(local.name) != local.stat().st_size:
                  raise SystemExit(f"::error::{tag} is missing the verified {local.name} asset")

          if assets.get(package) != int(size):
              raise SystemExit(
                  f"::error::{tag} does not carry {package} at {size} bytes. It carries: "
                  + (", ".join(f"{name} ({n} bytes)" for name, n in sorted(assets.items())) or "nothing")
              )
          print(f"published {tag}: {package} ({size} bytes)")
          CONFIRM

          echo "published ${tag}: \`${PACKAGE}\` (${bytes} bytes)" >> "$GITHUB_STEP_SUMMARY"


  curseforge:
    name: publish the checked bundle to CurseForge
    needs: [build, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-curseforge.yml
    with:
      release_tag: ${{ needs.build.outputs.tag }}
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_PROJECT_ID: ${{ secrets.CF_PROJECT_ID }}