name: Release

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: check and build the package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.build.outputs.version }}
      package: ${{ steps.build.outputs.package }}
      sha256: ${{ steps.build.outputs.sha256 }}
      tag: ${{ steps.build.outputs.tag }}
      channel: ${{ steps.build.outputs.channel }}
    steps:
      - name: Check out the repository, with all of its history
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Check the runner's python
        run: |
          set -euo pipefail
          python3 --version
          python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 9) else "python3 >= 3.9 required")'

      - name: Read component pins and versions
        id: pins
        run: |
          set -euo pipefail
          for component in database auction; do
            pin="$(python3 .github/release/components.py --pin "$component")"
            ver="$(python3 .github/release/components.py --version "$component")"
            echo "$component=$pin" >> "$GITHUB_OUTPUT"
            echo "${component}_version=$ver" >> "$GITHUB_OUTPUT"
          done

      - name: Check out PandaQuest Database
        uses: actions/checkout@v4.2.2
        with:
          repository: vem882/pqDB
          ref: ${{ steps.pins.outputs.database }}
          path: .components/database
          persist-credentials: false

      - name: Check out PandaQuest Auction
        uses: actions/checkout@v4.2.2
        with:
          repository: vem882/pqAuction
          ref: ${{ steps.pins.outputs.auction }}
          path: .components/auction
          persist-credentials: false

      - name: Download the published component releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .components/releases
          database="$(python3 .github/release/components.py --version database)"
          auction="$(python3 .github/release/components.py --version auction)"
          gh release download "v$database" -R vem882/pqDB --pattern "PandaQuestDB-$database.zip" --dir .components/releases
          gh release download "v$auction" -R vem882/pqAuction --pattern "PandaQuestAuction-$auction.zip" --dir .components/releases

      # check.py validoi pandaquest-repositorion oman PandaQuest/-hakemiston.
      # Jos se epäonnistuu, build jatkuu ja virhe näkyy varoituksena.
      - name: Run the checks on the core addon
        continue-on-error: true
        run: python3 .github/release/check.py -v

      # Valinnainen: Lua-lint. Poista kommenttimerkit, jos haluat ottaa käyttöön.
      # - name: Lint Lua files
      #   run: |
      #     sudo apt-get update && sudo apt-get install -y lua-check
      #     luacheck PandaQuest --no-color

      - name: Build the package
        id: build
        env:
          DATABASE_VERSION: ${{ steps.pins.outputs.database_version }}
          AUCTION_VERSION: ${{ steps.pins.outputs.auction_version }}
        run: |
          set -euo pipefail
          version="$(python3 .github/release/build.py version)"
          tag="$(python3 .github/release/build.py tag)"
          channel="$(python3 .github/release/build.py channel)"
          core="PandaQuest-Core-${version}.zip"
          package="PandaQuest-${version}+pqAuction-${AUCTION_VERSION}+pqDB-${DATABASE_VERSION}.zip"

          for output in dist second; do
            python3 .github/release/build.py package --out "${output}/${core}"
            python3 .github/release/components.py --core "${output}/${core}" --out "${output}" \
              --database .components/database --auction .components/auction --releases .components/releases
            mv "${output}/PandaQuest-${version}.zip" "${output}/${package}"
            rm -f "${output}"/PandaQuest-Core-*.zip \
                  "${output}"/PandaQuestDB-*.zip \
                  "${output}"/PandaQuestAuction-*.zip
          done

          first="$(sha256sum "dist/${package}" | cut -d' ' -f1)"
          for artifact in dist/*.zip; do
            cmp "$artifact" "second/${artifact##*/}"
          done
          sha256sum dist/*.zip > dist/SHA256SUMS
          rm -rf second

          {
            echo "version=${version}"
            echo "package=${package}"
            echo "sha256=${first}"
            echo "tag=${tag}"
            echo "channel=${channel}"
          } >> "$GITHUB_OUTPUT"

      - name: Write the release notes' changelog
        run: |
          set -euo pipefail
          mkdir -p release-notes
          python3 .github/release/curseforge.py notes --version "${{ steps.build.outputs.version }}" \
            --tag "${{ steps.build.outputs.tag }}" > release-notes/changes.md

      - name: Keep the package
        uses: actions/upload-artifact@v4.4.3
        with:
          name: PandaQuest-${{ steps.build.outputs.version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Keep the release notes' changelog
        uses: actions/upload-artifact@v4.4.3
        with:
          name: release-notes-${{ steps.build.outputs.version }}
          path: release-notes/changes.md
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish the release asset
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - name: Take the package the build job checked
        uses: actions/download-artifact@v4.1.8
        with:
          name: PandaQuest-${{ needs.build.outputs.version }}
          path: dist

      - name: Take the release notes' changelog
        uses: actions/download-artifact@v4.1.8
        with:
          name: release-notes-${{ needs.build.outputs.version }}
          path: release-notes

      - name: Check the bytes are the ones that were built
        run: |
          set -euo pipefail
          sha256sum --check --strict dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PACKAGE: ${{ needs.build.outputs.package }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          TAG: ${{ needs.build.outputs.tag }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          bytes="$(stat -c%s "dist/${PACKAGE}")"
          if [ "${CHANNEL}" = "beta" ]; then
            label="${VERSION} (beta)"
            kind="Pre-release: new features here have not yet been confirmed in the game."
            prerelease="true"
          else
            label="${VERSION}"
            kind="Stable release."
            prerelease="false"
          fi
          printf '%s\n' \
            "PandaQuest ${label} for MoP Classic, Classic Era, TBC Anniversary and WoW Forever." \
            "${kind}" \
            "" \
            "| | |" \
            "|---|---|" \
            "| commit | \`${GITHUB_SHA}\` |" \
            "| asset | \`${PACKAGE}\` |" \
            "| sha256 | \`${SHA256}\` |" \
            "" \
            "Unzip \`${PACKAGE}\` into the Interface/AddOns folder for your game version." \
            "Licence: GPLv3. Content is completed at the PandaQuest portal, pd.zroot.it." > notes.md
          if [ -s release-notes/changes.md ]; then
            { echo; cat release-notes/changes.md; } >> notes.md
          fi

          gh release list --limit 200 --json tagName,isDraft,isPrerelease > releases.json

          python3 - "${tag}" "${VERSION}" releases.json exists.txt <<'GUARD'
          import json
          import re
          import sys

          tag, version, listing, answer = sys.argv[1:5]
          releases = json.loads(open(listing, encoding="utf-8").read())

          def key(value):
              return tuple(int(part) for part in value.split("."))

          published = [
              match.group(1)
              for release in releases
              for match in [re.fullmatch(r"v(\d+(?:\.\d+)*)(?:-beta)?", release["tagName"])]
              if match and match.group(1) != version
          ]
          if published:
              highest = max(published, key=key)
              if key(version) <= key(highest):
                  raise SystemExit(
                      f"::error::{version} does not sort above {highest}, which this repository "
                      "has already published. Anything that picks the highest version would keep "
                      "offering that one, and nothing would report it."
                  )
              print(f"{version} sorts above {highest}, the highest already published")
          else:
              print(f"{version} is the first release here with a version-shaped tag")

          found = any(release["tagName"] == tag for release in releases)
          open(answer, "w", encoding="utf-8").write("yes" if found else "no")
          GUARD

          if [ "$(cat exists.txt)" = "yes" ]; then
            gh release view "${tag}" --json isDraft,assets > release.json
            same="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1], encoding="utf-8")); print(any(a["name"] == sys.argv[2] and a["size"] == int(sys.argv[3]) for a in r["assets"]))' \
              release.json "${PACKAGE}" "${bytes}")"
            if [ "${same}" = "True" ]; then
              echo "${tag} already carries ${PACKAGE} at ${bytes} bytes; leaving it alone"
            else
              echo "${tag} exists without these bytes; uploading ${PACKAGE}"
              gh release upload "${tag}" "dist/${PACKAGE}" --clobber
            fi
            draft="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["isDraft"])' release.json)"
            if [ "${draft}" = "True" ]; then
              echo "::warning::${tag} was left as a draft; publishing it now"
              if [ "${prerelease}" = "true" ]; then
                gh release edit "${tag}" --draft=false --prerelease
              else
                gh release edit "${tag}" --draft=false --prerelease=false --latest
              fi
            elif [ "${prerelease}" = "true" ]; then
              gh release edit "${tag}" --prerelease
            else
              gh release edit "${tag}" --prerelease=false
            fi
          else
            if [ "${prerelease}" = "true" ]; then
              flags=(--prerelease --latest=false)
            else
              flags=(--latest)
            fi
            gh release create "${tag}" dist/*.zip \
              --target "${GITHUB_SHA}" \
              --title "PandaQuest ${label}" \
              --notes-file notes.md \
              "${flags[@]}"
          fi

      - name: Check the release a player would download
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PACKAGE: ${{ needs.build.outputs.package }}
          TAG: ${{ needs.build.outputs.tag }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          bytes="$(stat -c%s "dist/${PACKAGE}")"
          gh release view "${tag}" --json tagName,isDraft,isPrerelease,assets > published.json

          python3 - "${tag}" "${PACKAGE}" "${bytes}" published.json "${CHANNEL}" <<'CONFIRM'
          import json
          import sys

          tag, package, size, path, channel = sys.argv[1:6]
          release = json.loads(open(path, encoding="utf-8").read())
          assets = {asset["name"]: asset["size"] for asset in release["assets"]}

          if release["isDraft"]:
              raise SystemExit(
                  f"::error::{tag} is still a draft. The public releases API does not serve a "
                  "draft, so the portal would download nothing."
              )
          if release["isPrerelease"] != (channel == "beta"):
              raise SystemExit(
                  f"::error::{tag} is {'a prerelease' if release['isPrerelease'] else 'not a prerelease'} "
                  f"but the build's channel is {channel}. A beta must not go out as the stable release, "
                  "or the other way round."
              )
          from pathlib import Path

          for local in Path("dist").glob("*.zip"):
              if assets.get(local.name) != local.stat().st_size:
                  raise SystemExit(f"::error::{tag} is missing the verified {local.name} asset")

          if assets.get(package) != int(size):
              raise SystemExit(
                  f"::error::{tag} does not carry {package} at {size} bytes. It carries: "
                  + (", ".join(f"{name} ({n} bytes)" for name, n in sorted(assets.items())) or "nothing")
              )
          print(f"published {tag}: {package} ({size} bytes)")
          CONFIRM

          echo "published ${tag}: \`${PACKAGE}\` (${bytes} bytes)" >> "$GITHUB_STEP_SUMMARY"

  # CurseForge-julkaisu on toistaiseksi pois päältä. Kun olet päivittänyt
  # publish-curseforge.yml:n (alla), poista kommenttimerkit tämän jobin ympäriltä.
  # curseforge:
