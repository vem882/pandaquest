  #   needs: [build, release]
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   permissions:
  #     contents: write
  #   uses: ./.github/workflows/publish-curseforge.yml
  #   with:
  #     release_tag: ${{ needs.build.outputs.tag }}
  #   secrets:
  #     CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  #     CF_PROJECT_ID: ${{ secrets.CF_PROJECT_ID }}